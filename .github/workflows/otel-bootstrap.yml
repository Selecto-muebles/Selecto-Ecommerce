name: OpenTelemetry dependency bootstrap (temporary)

on:
  push:
    branches: [feat/otel-observability]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Focused tracing tests
        run: go test ./internal/observability ./internal/delivery/http/middleware
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Export resolved module files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-module-files
          path: |
            go.mod
            go.sum
          if-no-files-found: error
