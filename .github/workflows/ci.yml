name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: selecto_test
          POSTGRES_USER: selecto
          POSTGRES_PASSWORD: selecto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U selecto -d selecto_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://selecto:selecto_test@localhost:5432/selecto_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Apply migrations twice
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_orders_checkout.sql -f migrations/002_production_hardening.sql -f migrations/003_customer_profile.sql -f migrations/004_admin_backoffice_indexes.sql -f migrations/005_product_merchandising.sql -f migrations/006_google_identity_and_shipping.sql -f migrations/007_order_delivery_preference.sql -f migrations/008_customer_account_and_notifications.sql -f migrations/009_email_outbox_due_index.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_orders_checkout.sql -f migrations/002_production_hardening.sql -f migrations/003_customer_profile.sql -f migrations/004_admin_backoffice_indexes.sql -f migrations/005_product_merchandising.sql -f migrations/006_google_identity_and_shipping.sql -f migrations/007_order_delivery_preference.sql -f migrations/008_customer_account_and_notifications.sql -f migrations/009_email_outbox_due_index.sql
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Enforce source file size
        run: bash scripts/check_source_size.sh
      - name: Verify architecture boundaries
        run: bash scripts/check_architecture.sh
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: ecommerce-coverage-pg17
          path: coverage.out
          retention-days: 14

  postgres-18-compatibility:
    name: postgres-18-compatibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: selecto_test
          POSTGRES_USER: selecto
          POSTGRES_PASSWORD: selecto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U selecto -d selecto_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://selecto:selecto_test@localhost:5432/selecto_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Apply migrations twice
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_orders_checkout.sql -f migrations/002_production_hardening.sql -f migrations/003_customer_profile.sql -f migrations/004_admin_backoffice_indexes.sql -f migrations/005_product_merchandising.sql -f migrations/006_google_identity_and_shipping.sql -f migrations/007_order_delivery_preference.sql -f migrations/008_customer_account_and_notifications.sql -f migrations/009_email_outbox_due_index.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_orders_checkout.sql -f migrations/002_production_hardening.sql -f migrations/003_customer_profile.sql -f migrations/004_admin_backoffice_indexes.sql -f migrations/005_product_merchandising.sql -f migrations/006_google_identity_and_shipping.sql -f migrations/007_order_delivery_preference.sql -f migrations/008_customer_account_and_notifications.sql -f migrations/009_email_outbox_due_index.sql
      - run: go test ./...

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: selecto-ecommerce:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  preflight:
    name: preflight
    if: always()
    needs: [quality, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
